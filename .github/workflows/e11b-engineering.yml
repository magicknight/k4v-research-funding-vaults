name: E11B engineering
on:
  push:
    branches: [codex/e11b-compact-bootstrap]
  pull_request:
    paths:
      - 'candidates/launch-vault-v7/**'
      - 'clients/launch_v7*'
      - 'src/e11b*'
      - 'src/launch_v7*'
      - 'tools/*e11b*'
      - '.github/workflows/e11b-engineering.yml'
permissions:
  contents: read
jobs:
  candidate-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Derive isolated candidate without changing frozen parents
        run: |
          if [ ! -d candidates/launch-vault-v7 ]; then
            python3 tools/materialize_e11b_candidate.py
            python3 tools/materialize_e11b_integration.py
          fi
          sha256sum -c SHA256SUMS
          npm ci --ignore-scripts
      - name: Install pinned Solana CLI
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build disabled and TEST_ONLY SBF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/e11b
          cargo fmt --manifest-path candidates/launch-vault-v7/Cargo.toml
          for profile in disabled test; do
            features=()
            if [[ "$profile" == test ]]; then features=(--features test-profile); fi
            CARGO_TARGET_DIR=/tmp/k4v-e11b-sbf NO_DNA=1 cargo build-sbf --tools-version v1.52 --manifest-path candidates/launch-vault-v7/Cargo.toml --sbf-out-dir "target/v7-$profile" -- --locked "${features[@]}" 2>&1 | tee "target/e11b/build-$profile.log"
            python3 - "target/e11b/build-$profile.log" <<'PY'
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text().lower()
          assert not any(s in text for s in ('stack offset', 'overwrites values', 'error:')), 'SBF_DIAGNOSTICS'
          PY
          done
          python3 tools/e11b_pin_build.py | tee target/e11b/build-identity.json
      - name: Compiler ABI and signed bootstrap, financial and timing regressions
        shell: bash
        env:
          CARGO_TARGET_DIR: /tmp/k4v-e11b-native
          K4V_E11B_REHEARSAL_OUT: ${{ github.workspace }}/target/e11b/raw-rehearsal.json
          K4V_E11B_PROBE_OUT_DIR: ${{ github.workspace }}/target/e11b/probes
        run: |
          set -euo pipefail
          python3 tools/build_launch_v7_idl.py
          cargo clippy --manifest-path candidates/launch-vault-v7/Cargo.toml --all-targets --features test-profile --locked -- -D warnings
          cargo test --manifest-path candidates/launch-vault-v7/Cargo.toml --features test-profile --locked 2>&1 | tee target/e11b/rust-tests.log
          node --test probes/launch_v7_identity.test.mjs clients/launch_v7_local_client.test.mjs clients/launch_v7_bootstrap.test.mjs 2>&1 | tee target/e11b/js-tests.log
      - name: Independent raw preparation and financial continuity verification
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_e11b_probes.py target/e11b/probes
          python3 tools/pack_e11b_rehearsal.py target/e11b/raw-rehearsal.json target/e11b/fresh-bundle.json
          PYTHONPATH=src python3 src/e11b_verifier.py target/e11b/fresh-bundle.json > target/e11b/financial-verification.json
          PYTHONPATH=src python3 tools/e11b_verify_tests.py 2>&1 | tee target/e11b/python-tests.log
          python3 tools/e11b_recorded_rpc.py --bundle target/e11b/fresh-bundle.json --output target/e11b/loopback-replay.json
      - name: Actual Agave six-role bootstrap, finalized transactions and raw RPC
        run: node tools/e11b_agave_rehearsal.mjs
      - name: Preserve exact parent artifacts and bind candidate source
        run: |
          sha256sum -c SHA256SUMS
          git diff --exit-code -- candidates/launch-vault-v6 src/launch_v6_rpc_exporter.py
          python3 tools/e11b_pin_build.py
      - name: Package inspectable source and all available evidence
        if: always()
        run: |
          mkdir -p target/e11b/export
          git rev-parse HEAD > target/e11b/export/checked-out-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import tarfile, hashlib, json
          root = Path('.')
          patterns = ['candidates/launch-vault-v7/**/*', 'idl/launch_vault_v7.json', 'spec/LAUNCH_V7*', 'probes/launch_v7*', 'clients/launch_v7*', 'src/launch_v7*', 'src/e11b*', 'tools/*e11b*', 'tools/build_launch_v7_idl.py']
          files = sorted({p for pattern in patterns for p in root.glob(pattern) if p.is_file() and '__pycache__' not in p.parts and 'target' not in p.parts})
          with tarfile.open('target/e11b/export/generated-source.tar.gz', 'w:gz') as archive:
              for path in files: archive.add(path, arcname=str(path))
          Path('target/e11b/export/source-sha256.json').write_text(json.dumps({str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}, indent=2)+'\n')
          with tarfile.open('target/e11b/export/evidence.tar.gz', 'w:gz') as archive:
              for path in sorted(Path('target/e11b').rglob('*')):
                  if path.is_file() and 'export' not in path.parts: archive.add(path, arcname=str(path))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e11b-acceptance-${{ github.sha }}
          path: target/e11b/export/
          if-no-files-found: error
          retention-days: 14
