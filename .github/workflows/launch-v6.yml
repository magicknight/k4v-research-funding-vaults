name: launch-v6-submission-window-test-only

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launch-v6-bounded-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Solana CLI 3.1.10
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Rebuild exact v6 SBF and reproduce E-10 local signed evidence
        run: bash tools/run_e10_local_reproduction.sh
