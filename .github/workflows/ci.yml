name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install package metadata without historical probe dependencies
        run: npm ci
      - name: Syntax-check non-mainnet Solana probe
        run: npm run check
      - name: Verify release checksums
        run: sha256sum -c SHA256SUMS
