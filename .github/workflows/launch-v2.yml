name: launch-v2-test-only

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launch-v2-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Solana CLI 3.1.10
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build closed-admission and explicit TEST_ONLY artifacts
        run: |
          set -euo pipefail
          NO_DNA=1 cargo build-sbf --tools-version v1.52 \
            --manifest-path programs/launch-vault-v2/Cargo.toml \
            --sbf-out-dir target/v2-disabled -- --locked 2>&1 | tee /tmp/v2-disabled.log
          NO_DNA=1 cargo build-sbf --tools-version v1.52 \
            --manifest-path programs/launch-vault-v2/Cargo.toml \
            --sbf-out-dir target/v2-test -- --locked --features test-profile 2>&1 | tee /tmp/v2-test.log
          if grep -qi 'Stack offset' /tmp/v2-disabled.log /tmp/v2-test.log; then
            echo 'SBF stack-frame overflow is a failing gate'
            exit 1
          fi
      - name: Verify exact candidate artifact bindings
        run: python3 tools/verify_launch_v2_artifacts.py
      - name: Lint and execute real-token lifecycle tests
        env:
          CARGO_TARGET_DIR: /tmp/k4v-native-target
        run: |
          cargo fmt --all -- --check
          cargo clippy -p launch-vault-v2 --all-targets --features test-profile --locked -- -D warnings
          cargo test -p launch-vault-v2 --features test-profile --locked
      - name: Rebuild and check compiler-generated IDL
        env:
          CARGO_TARGET_DIR: /tmp/k4v-native-target
        run: python3 tools/build_launch_v2_idl.py --check
      - name: Verify independent JavaScript identity codec
        run: node --test probes/launch_v2_identity.test.mjs
