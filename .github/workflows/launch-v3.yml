name: launch-v3-test-only

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launch-v3-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Solana CLI 3.1.10
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build closed-admission and explicit TEST_ONLY artifacts
        run: |
          set -euo pipefail
          NO_DNA=1 cargo build-sbf --tools-version v1.52 \
            --manifest-path programs/launch-vault-v3/Cargo.toml \
            --sbf-out-dir target/v3-disabled -- --locked 2>&1 | tee /tmp/v3-disabled.log
          NO_DNA=1 cargo build-sbf --tools-version v1.52 \
            --manifest-path programs/launch-vault-v3/Cargo.toml \
            --sbf-out-dir target/v3-test -- --locked --features test-profile 2>&1 | tee /tmp/v3-test.log
          if grep -qi 'Stack offset' /tmp/v3-disabled.log /tmp/v3-test.log; then
            echo 'SBF stack-frame overflow is a failing gate'
            exit 1
          fi
      - name: Verify exact candidate artifact bindings
        run: python3 tools/verify_launch_v3_artifacts.py
      - name: Lint and execute reserved-capacity and annual tests
        env:
          CARGO_TARGET_DIR: /tmp/k4v-native-target
          K4V_V3_SNAPSHOT_OUT: ${{ github.workspace }}/target/v3-raw-snapshot.json
        run: |
          cargo fmt --all -- --check
          cargo clippy -p launch-vault-v3 --all-targets --features test-profile --locked -- -D warnings
          cargo test -p launch-vault-v3 --features test-profile --locked
      - name: Rebuild and check compiler-generated IDL
        env:
          CARGO_TARGET_DIR: /tmp/k4v-native-target
        run: python3 tools/build_launch_v3_idl.py --check
      - name: Verify independent JavaScript identity codec
        run: node --test probes/launch_v3_identity.test.mjs

      - name: Verify fresh runtime raw state and tamper cases independently
        run: |
          PYTHONPATH=src python3 src/launch_v3_verifier.py target/v3-raw-snapshot.json
          PYTHONPATH=src python3 -m unittest discover -s tests -p test_launch_v3_verifier.py -v
