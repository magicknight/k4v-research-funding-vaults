name: launch-v5-readonly-review-test-only

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launch-v5-readonly-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify exact scope and replay all v5 checkpoints over loopback HTTP
        env:
          K4V_E08_TRANSPORT_ONLY: "1"
        run: bash tools/run_e08_local_reproduction.sh
