name: E11B finalize accepted-source documentation once
on:
  push:
    branches: [codex/e11b-compact-bootstrap]
    paths:
      - '.github/workflows/e11b-publish.yml'
      - 'tools/finalize_e11b_docs.py'
permissions:
  contents: read
concurrency:
  group: e11b-source-publication
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'magicknight/k4v-research-funding-vaults' && github.ref == 'refs/heads/codex/e11b-compact-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Update only declared navigation documents and hashes; remove this one-shot workflow
        run: python3 tools/finalize_e11b_docs.py
