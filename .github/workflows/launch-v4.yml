name: launch-v4-recovery-test-only

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  launch-v4-recovery-and-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install Solana CLI 3.1.10
        run: |
          sh -c "$(curl --proto '=https' --tlsv1.2 -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Reproduce E-05 with exact artifacts, signed local transactions and independent verification
        run: bash tools/run_e05_local_reproduction.sh
